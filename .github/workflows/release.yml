name: Release APK

# La pubblicazione parte dal tag, che e' anche la versione (v1.0.2): da quella
# release l'app installata si accorge dell'aggiornamento e se lo installa.
# Percio' prima di pubblicare si controlla che tag e versionName combacino:
# un tag "v1.0.3" con versionName "1.0.2" produrrebbe un APK che l'app
# installata non riconoscerebbe mai come piu' recente.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Codice
        uses: actions/checkout@v7
        with:
          # Serve la storia per le note di rilascio generate automaticamente.
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # La chiave di firma e' l'identita' dell'app: deve essere sempre la
      # stessa, perche' Android rifiuta un aggiornamento firmato con una chiave
      # diversa (andrebbe disinstallata l'app, perdendo luoghi e foto). Sta nei
      # segreti del repository, mai nel codice: KEYSTORE_B64 e' il file .jks in
      # base64, gli altri tre sono alias e password. Se ne manca uno il
      # workflow si ferma prima di compilare.
      - name: Chiave di firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for nome in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!nome}" ]; then
              echo "::error::Manca il segreto $nome: senza la chiave completa la release uscirebbe non firmata, e nessun telefono la installerebbe come aggiornamento."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/miraglio-release.jks"
          # Le variabili lette da app/build.gradle.kts, senza keystore.properties
          # (che sul runner non esiste: e' in .gitignore).
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/miraglio-release.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Tag e versione devono coincidere
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          echo "tag=$TAG  versionName=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Il tag $GITHUB_REF_NAME non corrisponde a versionName $VERSION in app/build.gradle.kts: alza la versione e rifai il tag."
            exit 1
          fi

      - name: Test
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: APK di release
        run: ./gradlew --no-daemon assembleRelease

      # Rete di sicurezza: un APK non firmato, o firmato con un'altra chiave,
      # non si installerebbe sopra Miraglio e farebbe fallire l'aggiornamento su
      # tutti i telefoni. Meglio fermarsi qui che pubblicarlo.
      - name: Controllo della firma
        run: |
          set -o pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee firma.txt
          ATTESA="ce7eaa63429c09728693cde142b9f89891cbed91a6e643a67c1b69ec34250f73"
          if ! grep -qi "$ATTESA" firma.txt; then
            echo "::error::L'APK non e' firmato con la chiave di rilascio di Miraglio: i telefoni non lo accetterebbero come aggiornamento. Se hai rigenerato la chiave, aggiorna l'impronta in .github/workflows/release.yml e i segreti del repository."
            exit 1
          fi

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          APK="miraglio-${TAG#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          # Il checksum viaggia con l'APK: chi scarica puo' verificare che il
          # file sia arrivato integro, anche senza controllare la firma. Il
          # formato e' quello di sha256sum, cosi' `sha256sum -c` funziona.
          sha256sum "$APK" > "$APK.sha256"
          HASH="$(cut -d' ' -f1 "$APK.sha256")"
          # Il corpo della release e' la guida di installazione (INSTALLAZIONE.md),
          # poi GitHub ci appende il changelog generato: chi apre il link della
          # release deve trovare come installarla, non solo l'elenco dei commit.
          # Unica fonte delle istruzioni: si aggiorna solo INSTALLAZIONE.md.
          NOTES="$RUNNER_TEMP/note-release.md"
          cat INSTALLAZIONE.md > "$NOTES"
          printf '\n\n**SHA-256 di `%s`**\n\n```text\n%s\n```\n' "$APK" "$HASH" >> "$NOTES"
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --title "Miraglio ${TAG#v}" \
            --notes-file "$NOTES" \
            --generate-notes
