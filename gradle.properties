# 4g e non 2g: il test del grafico disegna il Compose vero con Robolectric
# (Skia nativa) e con 2g la JVM del test finisce in OutOfMemory.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
# Gli screenshot di riferimento stanno in src/test/screenshots (versionati):
# senza questa riga `captureRoboImage("x.png")` scriverebbe nella radice del
# modulo invece che nella cartella configurata con `roborazzi.outputDir`.
roborazzi.record.filePathStrategy=relativePathFromRoborazziContextOutputDirectory
kotlin.code.style=official
android.nonTransitiveRClass=true
